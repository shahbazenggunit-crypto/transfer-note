<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#0a3c23"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png"><title>EUGC Transfer Note</title>
<style>
html,body{margin:0;height:100%;background:#0e1411;overflow:hidden}
iframe{position:fixed;inset:0;width:100%;height:100%;border:0}
#splash{position:fixed;inset:0;z-index:5;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;text-align:center;padding:24px;box-sizing:border-box;color:#e8f3ec;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:radial-gradient(120% 90% at 50% 0%,#14402a 0%,#0e1411 62%);transition:opacity .5s ease,visibility .5s}
#splash.hide{opacity:0;visibility:hidden}
#splash .logo{width:92px;height:92px;border-radius:22px;box-shadow:0 0 0 1px rgba(34,197,94,.35),0 12px 40px rgba(34,197,94,.22);animation:pop .8s cubic-bezier(.2,.9,.3,1.2) both,glow 2.4s ease-in-out .8s infinite}
#splash .co{margin:22px 0 6px;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#7fd4a0;font-weight:600;animation:rise .7s .15s both}
#splash h1{margin:0;font-size:clamp(24px,6.5vw,34px);line-height:1.15;letter-spacing:.04em;text-transform:uppercase;font-weight:800;animation:rise .7s .3s both}
#splash h1 span{display:block;color:#22c55e}
#splash .sub{margin:12px 0 0;font-size:14px;color:#9fb3a7;max-width:300px;animation:rise .7s .45s both}
#splash .bar{margin-top:20px;width:min(220px,60vw);height:4px;border-radius:4px;background:rgba(255,255,255,.1);overflow:hidden;animation:rise .7s .6s both}
#splash .bar i{display:block;height:100%;width:0;border-radius:4px;background:linear-gradient(90deg,#16a34a,#4ade80);transition:width .25s ease-out}
#splash .pct{margin-top:14px;font-size:30px;font-weight:800;letter-spacing:.02em;color:#4ade80;font-variant-numeric:tabular-nums;animation:rise .7s .6s both}
#splash .msg{margin-top:12px;font-size:12px;color:#7d9185;letter-spacing:.06em;animation:rise .7s .7s both}
#splash .foot{position:absolute;bottom:18px;left:0;right:0;font-size:11px;color:#5f7367;letter-spacing:.05em}
@keyframes pop{from{opacity:0;transform:scale(.7)}to{opacity:1;transform:none}}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes glow{0%,100%{box-shadow:0 0 0 1px rgba(34,197,94,.35),0 12px 40px rgba(34,197,94,.18)}50%{box-shadow:0 0 0 1px rgba(34,197,94,.6),0 12px 54px rgba(34,197,94,.4)}}
@media (prefers-reduced-motion:reduce){#splash *{animation:none!important}}
</style></head><body>
<div id="splash" role="status" aria-live="polite">
<img class="logo" src="icon-192.png" alt="">
<div class="co">Engineering Unit Gen. Contracting LLC</div>
<h1>Stores Transfer<span>System 2026</span></h1>
<p class="sub">Material transfer notes, returns and repairs, tracked in one place.</p>
<div class="pct" id="spct">0%</div>
<div class="bar" style="margin-top:12px"><i id="sbar"></i></div>
<div class="msg" id="smsg">Loading, please wait…</div>
<div class="foot">Stores Department · Abu Dhabi</div>
</div>
<iframe id="f" allow="camera *; microphone *; clipboard-write *; fullscreen *; web-share *" allowfullscreen></iframe>
<script>
var f=document.getElementById("f"),sp=document.getElementById("splash"),pc=document.getElementById("spct"),pb=document.getElementById("sbar"),t0=Date.now(),done=false,p=0;
if(/[?&]r=/.test(location.search))document.getElementById("smsg").textContent="Opening your transfer note\u2026";
function show(){var n=Math.min(100,Math.floor(p));pc.textContent=n+"%";pb.style.width=n+"%"}
var tm=setInterval(function(){if(done)return;p+=(92-p)*0.05;show()},120);
function hide(){if(done)return;done=true;clearInterval(tm);
var c=setInterval(function(){p+=(100-p)*0.35+1;if(p>=100){p=100;clearInterval(c);show();setTimeout(function(){sp.classList.add("hide");setTimeout(function(){sp.style.display="none"},600)},350)}else show()},40)}
f.addEventListener("load",function(){setTimeout(hide,700)});
setTimeout(hide,12000);
f.src="https://script.google.com/macros/s/AKfycbygXZuuaWuLRKp2kbSfOR9_1P4XC_TbMTyXzU83NsQIbp4TViTFauwW_O4QmRnBhh2P/exec"+location.search;
</script>
<script>if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js");</script>
</body></html>
