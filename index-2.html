<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><title>Link Expired</title>
<style>
:root{--bg:#f2f6f3;--ink:#14231a;--mute:#5a6b61;--card:#fff;--line:#d3ddd6;--green:#16a34a;--btn:#0f7a3a}
@media (prefers-color-scheme:dark){:root{--bg:#0e1411;--ink:#e8f3ec;--mute:#9fb3a7;--card:#16221b;--line:#2a3a31;--green:#4ade80;--btn:#16a34a}}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:24px max(16px,env(safe-area-inset-left)) 24px max(16px,env(safe-area-inset-right));box-sizing:border-box}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:28px 24px;max-width:420px;width:100%;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.08)}
img{width:72px;height:72px;border-radius:18px}
.co{margin:14px 0 4px;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--green);font-weight:700}
h1{margin:0 0 8px;font-size:24px;line-height:1.2}
p{margin:0 0 20px;color:var(--mute)}
a.btn{display:block;background:var(--btn);color:#fff;text-decoration:none;font-weight:700;padding:14px 18px;border-radius:12px;font-size:17px}
small{display:block;margin-top:14px;color:var(--mute);font-size:12px;word-break:break-all}
</style></head><body>
<main class="card">
<img src="icon-192.png" alt="">
<div class="co">Engineering Unit Gen. Contracting LLC</div>
<h1>This link has expired</h1>
<p>Transfer Note has moved to a new address. Please open the new link to continue.</p>
<a class="btn" id="go" href="#">Open new link</a>
<small id="u"></small>
</main>
<script>
var NEW_BASE = "https://transfer-note-engineering-unit-uae.github.io/transfer-note/";
var target = NEW_BASE + location.search + location.hash;
document.getElementById("go").href = target;
document.getElementById("u").textContent = NEW_BASE;
try{ if(navigator.serviceWorker){ navigator.serviceWorker.getRegistrations().then(function(rs){ rs.forEach(function(r){ r.unregister(); }); }); } }catch(e){}
try{ if(window.caches){ caches.keys().then(function(ks){ ks.forEach(function(k){ caches.delete(k); }); }); } }catch(e){}
</script>
</body></html>
