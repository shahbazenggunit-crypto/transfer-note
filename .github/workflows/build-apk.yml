name: Build Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-apk.yml'
      - 'app.html'

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Bundle current app code
        run: |
          mkdir -p build/www
          curl -sSL --retry 3 -m 120 "https://script.google.com/macros/s/AKfycbygXZuuaWuLRKp2kbSfOR9_1P4XC_TbMTyXzU83NsQIbp4TViTFauwW_O4QmRnBhh2P/exec?api=html" -o build/page.json
          python3 - <<'PY'
          import json
          d=json.load(open('build/page.json'))
          assert len(d['html'])>100000, 'app code too small'
          open('build/www/bundled.html','w').write(d['html'])
          open('build/www/bundled.ver','w').write(d['v'])
          PY

      - name: Prepare web files
        run: |
          mkdir -p build/www
          cp index.html app.html icon-192.png icon-512.png build/www/
          python3 - <<'PY'
          import re
          p='build/www/index.html'
          s=open(p).read()
          s=re.sub(r'<link rel="manifest"[^>]*>','',s)
          s=re.sub(r'<script>if\("serviceWorker" in navigator\)[^<]*</script>','',s)
          open(p,'w').write(s)
          PY

      - name: Create Android project
        working-directory: build
        run: |
          npm init -y
          npm i @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7 @capacitor/filesystem@7 @capacitor/share@7 @capacitor-community/file-opener@7.0.1
          npx cap init "Transfer Note" com.eugc.transfernote --web-dir www
          npx cap add android
          python3 -m pip install --quiet pillow

      - name: Icons, splash, colours, permissions
        working-directory: build
        run: |
          python3 - <<'PY'
          import json, re, glob, os
          from PIL import Image, ImageDraw
          bg=(10,60,35); dark=(14,20,17)
          cfg=json.load(open('capacitor.config.json'))
          cfg['backgroundColor']='#0e1411'
          json.dump(cfg,open('capacitor.config.json','w'),indent=2)
          res='android/app/src/main/res'
          icon=Image.open('www/icon-512.png').convert('RGBA')
          # adaptive icon foreground + background colour
          os.makedirs(res+'/mipmap-anydpi-v26',exist_ok=True)
          for d,sz in {'mdpi':108,'hdpi':162,'xhdpi':216,'xxhdpi':324,'xxxhdpi':432}.items():
              os.makedirs(f'{res}/mipmap-{d}',exist_ok=True)
              fg=Image.new('RGBA',(sz,sz),(0,0,0,0))
              k=int(sz*0.62); im=icon.resize((k,k),Image.LANCZOS)
              fg.paste(im,((sz-k)//2,(sz-k)//2),im)
              fg.save(f'{res}/mipmap-{d}/ic_fg.png')
          for d,sz in {'mdpi':48,'hdpi':72,'xhdpi':96,'xxhdpi':144,'xxxhdpi':192}.items():
              im=icon.resize((sz,sz),Image.LANCZOS)
              im.save(f'{res}/mipmap-{d}/ic_launcher.png')
              m=Image.new('L',(sz,sz),0); ImageDraw.Draw(m).ellipse((0,0,sz-1,sz-1),fill=255)
              r=Image.new('RGBA',(sz,sz),(0,0,0,0)); r.paste(im,(0,0),m); r.save(f'{res}/mipmap-{d}/ic_launcher_round.png')
          xml='<?xml version="1.0" encoding="utf-8"?>\n<adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">\n<background android:drawable="@color/ic_bg"/>\n<foreground android:drawable="@mipmap/ic_fg"/>\n</adaptive-icon>\n'
          for n in ('ic_launcher','ic_launcher_round'):
              open(f'{res}/mipmap-anydpi-v26/{n}.xml','w').write(xml)
          open(f'{res}/values/ic_bg.xml','w').write('<?xml version="1.0" encoding="utf-8"?>\n<resources><color name="ic_bg">#0A3C23</color></resources>\n')
          # splash: dark background with the logo
          for f in glob.glob(res+'/drawable*/splash.png'):
              w,h=Image.open(f).size
              s=Image.new('RGB',(w,h),dark); k=int(min(w,h)*0.28); im=icon.resize((k,k),Image.LANCZOS)
              s.paste(im,((w-k)//2,(h-k)//2),im); s.save(f)
          # status bar / navigation bar colours
          p=res+'/values/styles.xml'; s=open(p).read()
          s=re.sub(r'(<style name="AppTheme\.NoActionBar"[^>]*>)',r'\1\n<item name="android:statusBarColor">#0E1411</item>\n<item name="android:navigationBarColor">#0E1411</item>',s,1)
          open(p,'w').write(s)
          # camera permission for photo capture
          p='android/app/src/main/AndroidManifest.xml'; s=open(p).read()
          if 'android.permission.CAMERA' not in s:
              s=s.replace('<application','<uses-permission android:name="android.permission.CAMERA" />\n    <uses-feature android:name="android.hardware.camera" android:required="false" />\n    <application',1)
          open(p,'w').write(s)
          PY
          npx cap sync android

      - name: Accept Android licences
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Build APK
        working-directory: build/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../../TransferNote.apk

      - uses: actions/upload-artifact@v4
        with:
          name: TransferNote-apk
          path: TransferNote.apk

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "apk-${{ github.run_number }}" TransferNote.apk --title "Transfer Note APK ${{ github.run_number }}" --notes "Android app. Download TransferNote.apk and install it." --latest
